# 起動は必ず ./scripts/compose.sh 経由（環境ファイルの読み込み順を固定するため）
x-optixjp-entrypoint: ${OPTIXJP_COMPOSE_ENTRYPOINT:?Use ./scripts/compose.sh instead of raw docker compose}

x-service-base: &service-base
  image: optix-japan:${APP_COMMIT:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-local}
  env_file:
    - path: .env
      required: false
    - path: machine.env
      required: false
    - path: secrets.env
      required: false
  environment:
    HOST_BIND: ${HOST_BIND:-127.0.0.1}
    PORT: ${PORT:-2100}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1}
    TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    DATA_DIR: /data
    # SQLite の一時ファイル置き場。既定の /tmp は 128MB の tmpfs なので、
    # 大きな表の作り直し（マイグレーション）や索引構築で溢れる。
    SQLITE_TMPDIR: /data/sqlite-tmp
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  init: true
  restart: unless-stopped
  # 共有アカウント（数据共通）: 既定はローカル名前付きボリューム（単独運用）。
  # 米国版と同居する本番では machine.env で
  #   SHARED_ACCOUNTS_DIR=<米国版データ実体のホストパス>
  #   ACCOUNTS_DB_PATH=/shared-accounts/accounts.db
  #   OPTIXJP_RUN_AS=<米国版コンテナと同じ uid:gid（例 100:101）>
  # を指定する。SQLite の WAL/журнал 副産物を双方向に書けるのは同一 uid だけ
  # （ACL 無しの最小権限で成立する共有）。既定 "app" はイメージ内ユーザー。
  # OPTIXJP_RUN_AS を変えたら JP データボリュームの所有者も同じ uid に合わせる。
  user: "${OPTIXJP_RUN_AS:-app}"
  group_add:
    - "${OPTIXJP_SHARED_GROUP:-app}"
  volumes:
    - optixjp-data:/data
    - ${SHARED_ACCOUNTS_DIR:-optixjp-shared-accounts}:/shared-accounts
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  backend:
    <<: *service-base
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2100}:8000"
    stop_grace_period: 60s

  worker:
    <<: *service-base
    command: python -m app.worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 600s

volumes:
  optixjp-data:
  optixjp-shared-accounts:
