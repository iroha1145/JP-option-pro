name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q backend/app

      # CI は外部データサービスに接続しない（テストは全て MockTransport/フィクスチャ）
      - name: Backend tests
        run: python -m pytest tests/ -q

      - name: Fixture pipeline smoke (radar + screener build)
        run: |
          DATA_DIR=/tmp/jp-ci-fixture python -m app.tools.dev_fixture --days 140 > /tmp/fixture.json
          python - <<'EOF'
          import json
          result = json.load(open('/tmp/fixture.json'))
          assert result['radar']['events_written'] >= 1, result
          assert result['screener_rows'] >= 10, result
          pub = result.get('publication') or {}
          assert pub.get('outcome') == 'published', result
          assert pub.get('publication_id'), result
          assert pub.get('score_version'), result
          print('fixture ok:', result['target_date'], pub['publication_id'])
          EOF
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend install & build
        run: |
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend-src

      # 辞書の重複キー。既存エントリはクオート無しで書かれているので
      # grep では見つからず、静かに片方が消える。
      - name: i18n dictionary duplicate gate
        run: node --experimental-strip-types frontend-src/tests/dict_no_duplicates.mjs

      - name: Frontend lint
        run: npm run lint --prefix frontend-src

      - name: Navigation and theme regression gates
        run: |
          node --experimental-strip-types --test frontend-src/tests/ui-contracts.mjs
          node --experimental-strip-types --test frontend-src/src/components/detail/chart-drawings/drawingAppearance.test.mjs
          node --experimental-strip-types --test frontend-src/src/components/charts/heatContrast.test.mjs

      - name: Color-mode preference gate
        run: node --experimental-strip-types --test frontend-src/tests/color-preference.mjs

      - name: Interaction and request regression gates
        run: |
          node --experimental-strip-types --test \
            frontend-src/tests/access-identity.mjs \
            frontend-src/tests/motion-refresh.mjs \
            frontend-src/tests/theme-reveal.mjs \
            frontend-src/tests/request-regressions.mjs \
            frontend-src/tests/query-registry-regressions.mjs \
            frontend-src/tests/watchlist-search-lifecycle.mjs \
            frontend-src/tests/page-refresh-cache.mjs

      - name: Screener freshness gate
        run: node --experimental-strip-types --test frontend-src/tests/screener-freshness.mjs

      - name: Chart defaults and saved preferences gate
        run: node --experimental-strip-types --test frontend-src/tests/chart-defaults.mjs

      - name: Chart drawing switch and navigation gate
        run: node --experimental-strip-types --test frontend-src/tests/chart-interaction.mjs

      - name: Chart centered annotation gate
        run: node --experimental-strip-types --test frontend-src/tests/chart-labels.mjs

      # 後端が組み立てた文（テンプレート + パラメータ）を 3 言語で描画できるか。
      # 辞書に載っていても引き方を間違えれば画面には出ない ——「載っているか」の
      # 門（pytest 側）とは別に見る。
      - name: i18n backend-text rendering gate
        run: node --experimental-strip-types frontend-src/tests/explain_text.mjs

      # コミット済み frontend/ はビルド成果物と完全一致していること（バイトゲート）
      - name: Frontend artifact byte gate
        run: diff -r frontend-src/dist frontend

      - name: Container shared-account UID smoke
        run: |
          # Match a server checkout made with umask 077.
          chmod -R go-rwx backend/app config frontend
          docker build -f backend/Dockerfile -t optix-japan-ci .
          docker run --rm --network none --read-only --user 100:101 optix-japan-ci \
            python -c "from app.main import _frontend_integrity; from app.repositories.intraday_store import IntradayStore; result = _frontend_integrity(); assert result['ready'], result; print('shared-account UID can import the backend and read all frontend assets')"

      - name: US-market residue gate
        run: |
          ! grep -rniE "America/New_York|premarket|postmarket|implied.?volatilit|option.?chain|\bSPY\b|\bQQQ\b" \
            --include="*.py" --include="*.ts" --include="*.tsx" \
            backend/app/services backend/app/api backend/app/repositories backend/app/providers \
            frontend-src/src/pages frontend-src/src/components frontend-src/src/api \
            || (echo "US-market residue found" && exit 1)
