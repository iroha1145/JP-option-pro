name: PR17 isolated finishing verification
on:
  push:
    branches: [codex/pr17-final-verification-20260908]
    paths: [.github/workflows/pr17-review-export.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/codex/pr17-final-verification-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      JP_BROWSER_EVIDENCE: ${{ github.workspace }}/browser-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr17-finishing
          git diff --exit-code fe3403875f78a41e60d74a124a627f533a73781a -- backend frontend-src frontend tests .github/workflows/ci.yml .gitignore
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.review/pr17-final-{i}.b64').read_text().strip() for i in range(5))
          # Normalize one identified transport typo; SHA-256 rejects any other change.
          encoded = encoded.replace('sJVbsWGc8ZPu', 'sJVbsWG8ZPu')
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '18e86b56c52ed6754022fe73ecafe7eed331736c651c1f3615d564e4628c63a2'
          Path('/tmp/pr17-finishing/source.patch').write_bytes(raw)
          PY
          git apply --check /tmp/pr17-finishing/source.patch
          git apply --index /tmp/pr17-finishing/source.patch
          git rm .review/pr17-final-*.b64 .github/workflows/pr17-review-export.yml
          git diff --cached --check
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt pytest -r browser-tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
      - name: Build production frontend and regenerate committed assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend-src 2>&1 | tee /tmp/pr17-finishing/build.log
          rm -rf frontend
          cp -a frontend-src/dist frontend
          diff -r frontend-src/dist frontend
      - name: Full backend and frontend regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/ -q 2>&1 | tee /tmp/pr17-finishing/backend.log
          python -m compileall -q backend/app browser-tests
          node --experimental-strip-types --test frontend-src/tests/color-preference.mjs frontend-src/tests/screener-freshness.mjs frontend-src/tests/pr17-final-review.mjs frontend-src/tests/pr17_review_fixes.mjs 2>&1 | tee /tmp/pr17-finishing/frontend.log
          node --experimental-strip-types frontend-src/tests/dict_no_duplicates.mjs
          node --experimental-strip-types frontend-src/tests/explain_text.mjs
          node --experimental-strip-types frontend-src/tests/key_stats.mjs
      - name: Real Chromium interactions with isolated API and worker
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest browser-tests/ -q --junitxml=browser-evidence/results.xml 2>&1 | tee /tmp/pr17-finishing/browser.log
      - name: Commit verified tree on temporary branch only
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml .gitignore backend frontend-src frontend tests browser-tests
          git diff --cached --check
          git fetch origin refs/heads/codex/pr17-final-verification-20260908
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'PR17 review'
          git config user.email '200401936+iroha1145@users.noreply.github.com'
          git commit -m 'fix(jp-screener): finish publication recovery, identity and browser verification'
          git push origin HEAD:refs/heads/codex/pr17-final-verification-20260908
          git rev-parse HEAD > /tmp/pr17-finishing/COMMIT.txt
          git rev-parse HEAD^{tree} > /tmp/pr17-finishing/TREE.txt
          git diff --binary fe3403875f78a41e60d74a124a627f533a73781a HEAD > /tmp/pr17-finishing/complete.patch
          git archive --format=zip --output=/tmp/pr17-finishing/verified-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr17-final-verification-evidence
          path: |
            /tmp/pr17-finishing/
            browser-evidence/
          retention-days: 7
          if-no-files-found: warn
