name: PR17 isolated review export
on:
  push:
    branches: [codex/pr17-final-verification-20260908]
    paths: [.github/workflows/pr17-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/codex/pr17-final-verification-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe3403875f78a41e60d74a124a627f533a73781a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Archive tracked source and test-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr17-review-export/wheels
          git bundle create /tmp/pr17-review-export/source.bundle --all
          git archive --format=zip --output=/tmp/pr17-review-export/source.zip HEAD
          python -m pip download --only-binary=:all: -d /tmp/pr17-review-export/wheels -r backend/requirements.txt pytest
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
          tar -czf /tmp/pr17-review-export/node_modules.tgz -C frontend-src node_modules
          git rev-parse HEAD > /tmp/pr17-review-export/BASE_SHA.txt
          cd /tmp/pr17-review-export
          sha256sum source.bundle source.zip node_modules.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr17-review-offline-inputs
          path: /tmp/pr17-review-export/
          retention-days: 2
          if-no-files-found: error
